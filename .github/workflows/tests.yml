name: Run Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # core + dev + ai (LangChain/LangGraph, no torch). The heavy `embeddings`
      # extra (sentence-transformers -> torch) is deliberately not installed.
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra ai

      - name: Lint
        run: |
          uv run ruff check backend/
          uv run ruff format backend/ --check

      - name: AI stack imports
        run: uv run python -c "import langgraph, langchain_groq"

      # The suite needs no secrets: backend/conftest.py provides test defaults
      # and the tests run against SQLite.
      - name: Run pytest
        working-directory: backend
        run: uv run pytest -v
