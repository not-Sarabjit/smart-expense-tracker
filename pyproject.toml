[project]
name = "smart-expense-tracker"
version = "0.1.0"
description = "FastAPI + PostgreSQL expense tracking API with AI-assisted categorization"
requires-python = ">=3.12"

dependencies = [
    # Web API
    "fastapi==0.139.0",
    "uvicorn==0.51.0",

    # Database and migrations
    "SQLAlchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "alembic==1.18.5",

    # Authentication and validation
    "pydantic==2.13.4",
    "pydantic-settings==2.9.1",
    "email-validator==2.3.0",
    "python-jose==3.5.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",

    # IANA time zone database for zoneinfo (Windows has no system copy)
    "tzdata==2025.2",

    # Structured (JSON) logging
    "structlog==26.1.0",

    # Redis — rate limiting now (1.7); Celery broker, locks, pub/sub later (Phase 6+)
    "redis==8.1.0",
]

[project.optional-dependencies]
ai = [
    # Agent stack (LangChain / LangGraph 1.x). Light: no torch. Installed in CI.
    "langchain==1.4.3",
    "langchain-core==1.6.6",
    "langgraph==1.2.12",
    "langchain-groq==1.1.3",     # brings the groq SDK
    "langchain-qdrant==1.1.0",
    "qdrant-client==1.19.1",
]
embeddings = [
    # Local embedding models. Heavy (pulls torch) — kept out of CI and the default install.
    "sentence-transformers==6.1.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.27.2",
    "locust==2.46.4",
    "ruff>=0.7.0",
    "fakeredis[lua]==2.39.0",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces flake8, isort, black)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names, etc.)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernise syntax to target-version)
    "B",    # flake8-bugbear (common pitfalls)
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long — the formatter handles wrapping
    "B008",  # function call in default arg — required by FastAPI's Depends()
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports are intentional
"backend/app/models/__init__.py" = ["F401"]
# migrations/env.py imports models for side effects (Alembic autogenerate)
"backend/migrations/env.py" = ["F401"]
# UP042: TransactionType(str, Enum) — changing to StrEnum requires testing
#        with SQLAlchemy/Alembic; will address when modernising models
"backend/app/models/transaction.py" = ["UP042"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/app/tests"]
pythonpath = ["backend"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
